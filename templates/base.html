<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MVP агрегатор данных по промышленности Москвы {% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  <style>
    body { padding-top: 56px; }
    .sidebar { height: calc(100vh - 56px); }
  </style>
</head>
<body>
  <!-- Навбар -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Агрегатор для ДИиПП Москвы</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'home' %}">Дашборды</a>
        <a class="nav-link" href="{% url 'about' %}">О проекте</a>
        <a class="nav-link" href="{% url 'contacts' %}">Контакты</a>
        {% if user.is_authenticated %}
          <div class="d-flex align-items-center">
    <a class="nav-link " href="{% url 'admin_dashboard' %}">Панель управления</a>
    <span class="navbar-text text-white mx-2">|</span>
    <span class="navbar-text text-white me-2">Привет, {{ user.username }}!</span>
    <form method="post" action="{% url 'logout' %}" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
    </form>
  </div>
</form>
        {% else %}
          <button class="btn btn-outline-light" hx-get="{% url 'login_modal' %}" hx-target="#modal-container">
            Войти
          </button>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Контейнер для модального окна -->
  <div id="modal-container"></div>

  <!-- Основной контент -->
  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS (для модальных окон) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
